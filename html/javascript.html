<!DOCTYPE html>
<html>

<body>

    <h2>Shopping Cart</h2>

    <p>Items in Cart: <span id="cart">0</span></p>

    <button onclick="addItem()">
        Add to Cart
    </button>

    <script>

        let items = 0;

        function addItem() {

            items++;

            document.getElementById("cart").innerHTML = items;

        }

    </script>

</body>

</html>
